<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SOULGRAIN · V5.2 鞋舌结构调试</title><style>*{box-sizing:border-box}body{margin:0;background:#111b29;color:#e5eef8;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:17px 22px;border-bottom:1px solid #405269}h1{font-size:20px;margin:0 0 4px}main{display:grid;grid-template-columns:1fr 300px;height:calc(100dvh - 108px);min-height:450px}#stage{min-width:0;min-height:360px}canvas{display:block;touch-action:none}aside{padding:20px;background:#182739;overflow:auto}label{display:block;margin:15px 0}button,.file{display:inline-block;padding:10px 14px;border:1px solid #6f879f;border-radius:7px;background:#223a50;color:#f3f7fb;margin:4px 2px;cursor:pointer}input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin-right:10px}input[type=range]{width:100%;height:34px}small{color:#b3c8d9}#file{max-width:240px}#status{font-size:13px;color:#c6d8e9}@media(max-width:800px){main{display:flex;flex-direction:column;height:auto}#stage{height:58dvh}aside{padding:15px}header{padding:12px 16px}label{display:inline-block;margin:10px 12px 10px 0}}</style><header><h1>SOULGRAIN / 鞋舌结构 V5.2</h1><div id="status">读取模型中…</div></header><main><section id="stage" aria-label="三维结构检查"></section><aside><label>选择 GLB<input id="file" type="file" accept=".glb"></label><label><input id="show" type="checkbox" checked>显示鞋舌</label><label><input id="highlight" type="checkbox">高亮鞋舌</label><label><input id="only" type="checkbox">仅显示完整鞋舌</label><p>原横跨鞋带已删除</p><label><input id="frontPart" type="checkbox" checked>前片：扇形端及开口覆盖面</label><label><input id="backPart" type="checkbox" checked>后片：翻折段及两孔</label><label>鞋舌移出 / 原位复装<input id="explode" type="range" min="0" max="1" step=".01" value="0"></label><div><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="side">侧面 / 厚度</button><button data-view="shoe">全鞋</button><button id="reset">复位全部</button></div><p><small>拖动旋转，双指缩放。本版实际删除原横跨鞋带，并按确认的方向缝合两片。原鞋眼与鞋带融合的交界仍有残缺，需要局部精修；裁片尺寸依据照片比例，尚未校准实物尺寸。本页为独立调试工具，未接入正式网站。</small></p></aside></main><script>/*BUNDLE*/</script></html>
